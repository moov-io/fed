# Use https://app.stepsecurity.io/ to improve workflow security
name: Podman

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Go Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Clone the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build
      run: make build

    - name: Check
      run: make check

    - name: Buildah Action
      id: build-image
      if: ${{ github.event.pull_request.head.repo.full_name == 'moov-io/fed' }}
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        image: moov/fed
        tags: podman-${{ github.sha }}
        containerfiles: |
          ./Dockerfile

    - name: Log in to the GitHub Container registry
      if: ${{ github.event.pull_request.head.repo.full_name == 'moov-io/fed' }}
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push to GitHub Container Repository
      if: ${{ github.event.pull_request.head.repo.full_name == 'moov-io/fed' }}
      id: push-to-ghcr
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: docker.io
